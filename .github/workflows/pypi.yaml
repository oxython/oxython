name: PyPI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build setuptools twine
      - name: Build
        env:
          GIT_COMMITTER_NAME: oxython
          GIT_COMMITTER_EMAIL: oxython@localhost
        run: scripts/build-dist.sh
      - run: twine check dist/*
      - name: Check that the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing, used when no token secret is set
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
